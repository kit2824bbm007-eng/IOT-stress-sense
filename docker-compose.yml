version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stresssense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stresssense}
      POSTGRES_USER: ${POSTGRES_USER:-stresssense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stresssense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stresssense} -d ${POSTGRES_DB:-stresssense}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
