# Server Configuration
server.port=8080
server.servlet.context-path=

# Application Info
spring.application.name=stresssense-backend

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stresssense}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:stresssense}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:stresssense}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Sensor Simulator Configuration
simulation.enabled=${SIMULATION_ENABLED:true}
simulation.interval-ms=${SIMULATION_INTERVAL_MS:500}
simulation.device-id=SIMULATOR_001
simulation.device-type=SIMULATOR

# CORS Configuration
cors.allowed-origins=*

# Logging
logging.level.com.stresssense=INFO
logging.level.org.springframework.web=INFO
